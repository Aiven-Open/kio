name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux:
    name: Build wheels · linux-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64
            manylinux: "2_28"
          - target: aarch64
            manylinux: "2_28"
          - target: x86_64
            manylinux: musllinux_1_2
          - target: aarch64
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set release version
        uses: ./.github/actions/set-version
        with:
          version: ${{ github.event.release.tag_name }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist -i 3.11 3.12 3.13 3.14 3.15
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: dist

  macos:
    name: Build wheels · macos-${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15-dev
      - name: Set release version
        uses: ./.github/actions/set-version
        with:
          version: ${{ github.event.release.tag_name }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: Build wheels · windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15-dev
      - name: Set release version
        uses: ./.github/actions/set-version
        with:
          version: ${{ github.event.release.tag_name }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.1
          target: x64
          args: --release --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set release version
        uses: ./.github/actions/set-version
        with:
          version: ${{ github.event.release.tag_name }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -eq 0 ]]; then
            echo "💥 No wheels found in dist/ to publish."
            exit 1
          fi
          mismatch=0
          for artifact in dist/*.whl dist/*.tar.gz; do
            name=$(basename "$artifact")
            if [[ "$name" != "kio-${RELEASE_TAG}-"* && "$name" != "kio-${RELEASE_TAG}.tar.gz" ]]; then
              echo "💥 '$name' does not match release tag '$RELEASE_TAG'."
              mismatch=1
            fi
          done
          if [[ "$mismatch" != "0" ]]; then
            exit 1
          fi
          echo "✅ All artifacts match release tag '$RELEASE_TAG'."
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
